# Development infrastructure.
#
# Production does not use this file — see docs/11_DEPLOYMENT.md. Credentials here are
# deliberately well-known development values and must never appear in a deployed environment;
# `apps/api` refuses to start with them when NODE_ENV=production.

name: shikkha

services:
  postgres:
    # pgvector is needed from Phase 29 (RAG). Including it now avoids a base-image swap later,
    # which would mean a full data reload on every developer's machine.
    image: pgvector/pgvector:pg17
    container_name: shikkha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shikkha_migrator
      POSTGRES_PASSWORD: shikkha_dev_password
      POSTGRES_DB: shikkha_dev
      # C collation with UTF-8 encoding: deterministic sort order across platforms, which
      # matters because index ordering must not differ between a developer's machine and the
      # server. Bangla collation is handled in queries, not by the database default.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shikkha_migrator -d shikkha_dev']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: shikkha-redis
    restart: unless-stopped
    # appendonly keeps queued jobs across a restart; losing an unsent SMS queue on a laptop
    # reboot makes background-job behaviour hard to reason about during development.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage, so the S3 adapter is exercised in development rather than
  # only the local-filesystem one. Optional: STORAGE_DRIVER=local skips it entirely.
  minio:
    image: minio/minio:latest
    container_name: shikkha-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: shikkha_dev
      MINIO_ROOT_PASSWORD: shikkha_dev_password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # Catches outbound mail in development. Nothing reaches a real inbox from a dev machine.
  mailpit:
    image: axllent/mailpit:latest
    container_name: shikkha-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    environment:
      MP_MAX_MESSAGES: 500

  # The AI gateway (apps/ai). Prompt assembly, provider routing and the tool-call loop.
  #
  # ───────────────────────────────────────────────────────────────────────────────────────────
  # READ THIS BEFORE "FIXING" THE MISSING DATABASE WIRING BELOW.
  #
  # This service has **no database environment variable and no `depends_on: postgres`**, and
  # that omission is the security property, not an oversight. `apps/ai` reaches institutional
  # data only by calling back into `apps/api` with the caller's own bearer token, so every read
  # and write is re-authorized against that person's permissions (docs/06 §1, docs/07 §1).
  #
  # "The AI must not bypass permissions" as a policy is something a prompt injection can talk
  # its way around. As a missing connection string, it is not. The container refuses to start
  # if one is present, so adding `DATABASE_URL` here does not grant access — it breaks the boot.
  #
  # It also has no `env_file`. A shared env file is precisely how the API's credentials end up
  # in this container by accident.
  # ───────────────────────────────────────────────────────────────────────────────────────────
  ai:
    build:
      context: ../apps/ai
      dockerfile: Dockerfile
    container_name: shikkha-ai
    restart: unless-stopped
    ports:
      - '8001:8000'
    environment:
      AI_ENVIRONMENT: development
      AI_LOG_LEVEL: info
      # host.docker.internal reaches apps/api running on the developer's machine; point this at
      # a service name instead once the API itself is containerised here.
      AI_API_BASE_URL: http://host.docker.internal:4000
      AI_API_PREFIX: api/v1
      # The mock provider needs no credentials and is deterministic, so `docker compose up`
      # produces a working gateway with nothing configured. It is refused in production.
      AI_PROVIDER: mock
      AI_MAX_TOOL_ITERATIONS: 6
      AI_MAX_WALL_CLOCK_SECONDS: 45
      AI_CORS_ORIGINS: http://localhost:3000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      # Liveness only. A readiness check here would restart the gateway during a brief API blip.
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres-data:
  redis-data:
  minio-data:
